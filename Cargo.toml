[package]
name = "swadedsbot"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "SWADE Discord Bot: dice roller and Benny tracker for Savage Worlds Adventure Edition"
license = "MIT"
repository = "https://example.invalid/swadedsbot"

[dependencies]
anyhow = "1"
dotenvy = "0.15"
poise = "0.6.2"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
pretty_assertions = "1"
